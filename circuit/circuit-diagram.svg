<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="white"/><text x="600" y="45" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">SMART WASTE SEGREGATION - CIRCUIT CONNECTIONS</text><rect x="440" y="250" width="320" height="260" rx="18" fill="#1976d2"/><text x="600" y="300" text-anchor="middle" font-family="Arial" font-size="28" fill="white" font-weight="bold">ARDUINO UNO</text><text x="600" y="340" text-anchor="middle" font-family="Arial" font-size="18" fill="white">Main Controller</text><g font-family="Arial" font-size="17" fill="#111"><rect x="45" y="100" width="250" height="130" rx="12" fill="#e8f5e9" stroke="#333"/><text x="170" y="135" text-anchor="middle" font-size="21" font-weight="bold">ULN2003 + STEPPER</text><text x="70" y="170">IN1 → D8</text><text x="70" y="195">IN2 → D9</text><text x="170" y="170">IN3 → D10</text><text x="170" y="195">IN4 → D11</text><rect x="45" y="290" width="250" height="120" rx="12" fill="#fff3e0" stroke="#333"/><text x="170" y="325" text-anchor="middle" font-size="21" font-weight="bold">SERVO MOTOR</text><text x="70" y="360">Signal → D6</text><text x="70" y="385">VCC → 5V   GND → GND</text><rect x="45" y="470" width="250" height="120" rx="12" fill="#fce4ec" stroke="#333"/><text x="170" y="505" text-anchor="middle" font-size="21" font-weight="bold">METAL SENSOR</text><text x="70" y="540">OUT → D7</text><text x="70" y="565">Brown → 5V   Blue → GND</text><rect x="905" y="100" width="250" height="120" rx="12" fill="#e3f2fd" stroke="#333"/><text x="1030" y="135" text-anchor="middle" font-size="21" font-weight="bold">IR SENSOR</text><text x="930" y="170">OUT → D5</text><text x="930" y="195">VCC → 5V   GND → GND</text><rect x="905" y="290" width="250" height="120" rx="12" fill="#f3e5f5" stroke="#333"/><text x="1030" y="325" text-anchor="middle" font-size="21" font-weight="bold">MOISTURE SENSOR</text><text x="930" y="360">AO → A0</text><text x="930" y="385">VCC → 5V   GND → GND</text><rect x="905" y="470" width="250" height="120" rx="12" fill="#fff8e1" stroke="#333"/><text x="1030" y="505" text-anchor="middle" font-size="21" font-weight="bold">BUZZER</text><text x="930" y="540">Positive → D4</text><text x="930" y="565">Negative → GND</text></g><g stroke="#555" stroke-width="3" fill="none"><path d="M295 160 H440"/><path d="M295 350 H440"/><path d="M295 530 H440"/><path d="M760 160 H905"/><path d="M760 350 H905"/><path d="M760 530 H905"/></g><g font-family="Arial" font-size="18" fill="#333"><text x="600" y="650" text-anchor="middle" font-weight="bold">POWER: 5V and COMMON GND</text><text x="600" y="685" text-anchor="middle">IR detects waste → Metal sensor checks metal → Moisture sensor checks wet/dry</text><text x="600" y="720" text-anchor="middle">Stepper controls the sorting gate • Servo directs the waste bin • Buzzer indicates detection</text></g></svg>